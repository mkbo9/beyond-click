[project]
name = "beyond-click"
version = "0.1.0"
description = "ML and VIS project"
readme = "README.md"
authors = [
    { name = "MBo", email = "353429225+mkbo9@users.noreply.github.com" }
]
requires-python = ">=3.12"

dependencies = [
    "google-api-python-client>=2.201.0",
    "isodate>=0.7.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "triton-xpu>=3.6.0",
]

[project.scripts]
beyond-click = "beyond_click:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

# --- XPU Configuration ---
[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-xpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-xpu", marker = "sys_platform == 'linux'" }]
triton-xpu = [{ index = "pytorch-xpu" }]
